services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dubbl_ui_test
      POSTGRES_PASSWORD: dubbl_ui_test
      POSTGRES_DB: dubbl_ui_test
    ports:
      - "127.0.0.1:${UI_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubbl_ui_test -d dubbl_ui_test"]
      interval: 2s
      timeout: 3s
      retries: 30
